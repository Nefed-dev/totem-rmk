# === Базовая информация ===
[keyboard]
name = "TOTEM"
product_name = "TOTEM Split BLE"
vendor_id = 0x3A3C
product_id = 0x0002
device_version = "0.3.0"
manufacturer = "GEIST"
chip = "nrf52840"

# === Раскладка ===
[layout]
rows = 4
cols = 10          # Логические колонки: 5 левая + 5 правая
layers = 6         # ← Обновлено: 6 слоёв

keymap = [
  # === Layer 0: Base ===
  [
    ["Q", "W", "E", "R", "T",   "Y", "U", "I", "O", "P"],
    ["A", "S", "D", "F", "G",   "H", "J", "K", "L", "Scln"],
    ["Z", "X", "C", "V", "B",   "N", "M", "Comm", "Dot", "Sls"],
    ["LCtrl", "LShift", "MO(1)", "Space", "LT(2, Tab)", "Bspc", "MO(1)", "RShift", "RCtrl", "Enter"]
  ],
  
  # === Layer 1: Fn ===
  [
    ["Kc1", "Kc2", "Kc3", "Kc4", "Kc5",   "Kc6", "Kc7", "Kc8", "Kc9", "Kc0"],
    ["F1", "F2", "F3", "F4", "F5",        "F6", "F7", "F8", "F9", "F10"],
    ["_", "_", "_", "_", "_",             "_", "_", "_", "_", "_"],
    ["_", "_", "TO(2)", "_", "_",         "_", "TO(0)", "_", "_", "_"]
  ],
  
  # === Layer 2: Nav ===
  [
    ["Escape", "LGui", "LAlt", "_", "_",   "_", "_", "_", "_", "_"],
    ["Tab", "Left", "Down", "Up", "Right", "PgUp", "Home", "End", "PgDn", "_"],
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "_", "TO(0)", "_", "_",          "_", "TO(0)", "_", "_", "_"]
  ],

  # === Layer 3: Media (пример) ===
  [
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "VolDown", "VolUp", "Mute", "_", "_", "Prev", "Play", "Next", "_"],
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "_", "TO(4)", "_", "_",          "_", "TO(0)", "_", "_", "_"]
  ],

  # === Layer 4: Mouse (пример) ===
  [
    ["_", "_", "MsWheelUp", "_", "_",      "_", "_", "MsClickR", "_", "_"],
    ["_", "MsLeft", "MsDown", "MsUp", "MsRight", "_", "_", "MsClickL", "_", "_"],
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "_", "TO(5)", "_", "_",          "_", "TO(0)", "_", "_", "_"]
  ],

  # === Layer 5: System (пример) ===
  [
    ["Reboot", "Bootloader", "_", "_", "_", "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",              "_", "_", "_", "_", "_"],
    ["_", "_", "TO(0)", "_", "_",          "_", "_", "_", "_", "_"]
  ],
]

# === Хранилище настроек ===
[storage]

# === BLE настройка ===
[ble]
enabled = true

# === Сплит-конфигурация ===
[split]
connection = "ble"

# === Центральная сторона (ЛЕВАЯ) ===
[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]

# === Периферийная сторона (ПРАВАЯ) ===
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P1_13", "P1_14", "P1_15", "P0_05", "P0_04"]
