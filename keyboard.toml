# === Базовая информация ===
[keyboard]
name = "TOTEM"
product_name = "TOTEM Split BLE"
vendor_id = 0x3A3C
product_id = 0x0002
device_version = "0.3.0"
manufacturer = "GEIST"
chip = "nrf52840"

[host]
# Unlock combination: simultaneous press of specified keys
# Format: [[row, col], [row, col], ...]
unlock_keys = [[0, 0], [0, 1]]  # Keys at (row=0,col=0) and (row=0,col=1)

# === Раскладка ===
[layout]
rows = 4
cols = 10
layers = 6

keymap = [
  # === Layer 0: Base (ЕДИНСТВЕННЫЙ заполненный слой) ===
  [
    ["Q", "W", "E", "R", "T",   "Y", "U", "I", "O", "P"],
    ["A", "S", "D", "F", "G",   "H", "J", "K", "L", "Semicolon"],
    ["Z", "X", "C", "V", "B",   "N", "M", "Comma", "Dot", "Slash"],
    ["LCtrl", "LShift", "_", "Space", "_", "Bspc", "_", "RShift", "RCtrl", "Enter"]
  ],
  
  # === Layer 1: Пустой ===
  [
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"]
  ],
  
  # === Layer 2: Пустой ===
  [
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"]
  ],

  # === Layer 3: Пустой ===
  [
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"]
  ],

  # === Layer 4: Пустой ===
  [
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"]
  ],

  # === Layer 5: Пустой ===
  [
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"],
    ["_", "_", "_", "_", "_",   "_", "_", "_", "_", "_"]
  ],
]

# === Хранилище настроек ===
[storage]

# === RMK Settings ===
[rmk]
combo_max_num = 16
morse_max_num = 16

# === BLE настройка ===
[ble]
enabled = true

# === Сплит-конфигурация ===
[split]
connection = "ble"

# === Центральная сторона (ЛЕВАЯ) ===
[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]

# === Периферийная сторона (ПРАВАЯ) ===
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 0
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P1_13", "P1_14", "P1_15", "P0_05", "P0_04"]
