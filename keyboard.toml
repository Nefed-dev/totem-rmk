# === Базовая информация ===
[keyboard]
name = "TOTEM"
product_name = "TOTEM Split BLE"
vendor_id = 0x3A3C
product_id = 0x0002
device_version = "0.3.0"
manufacturer = "GEIST"
chip = "nrf52840"

# === Раскладка ===
[layout]
rows = 4
cols = 5
layers = 3

keymap = [
  # === Layer 0: Base ===
  # Левая половина
  [
    ["Q", "W", "E", "R", "T"],
    ["A", "S", "D", "F", "G"],
    ["Z", "X", "C", "V", "B"],
    ["LCtrl", "LShift", "MO(1)", "Space", "LT(2, Tab)"]
  ],
  # Правая половина
  [
    ["Y", "U", "I", "O", "P"],
    ["H", "J", "K", "L", "Scln"],
    ["N", "M", "Comm", "Dot", "Sls"],
    ["Bspc", "MO(1)", "RShift", "RCtrl", "Enter"]
  ],

  # === Layer 1: Fn ===
  [
    ["Kc1", "Kc2", "Kc3", "Kc4", "Kc5"],
    ["F1", "F2", "F3", "F4", "F5"],
    ["_", "_", "_", "_", "_"],
    ["_", "_", "TO(2)", "_", "_"]
  ],
  [
    ["Kc6", "Kc7", "Kc8", "Kc9", "Kc0"],
    ["F6", "F7", "F8", "F9", "F10"],
    ["_", "_", "_", "_", "_"],
    ["_", "TO(0)", "_", "_", "_"]
  ],

  # === Layer 2: Nav ===
  [
    ["Escape", "LGui", "LAlt", "_", "_"],
    ["Tab", "Left", "Down", "Up", "Right"],
    ["_", "_", "_", "_", "_"],
    ["_", "_", "TO(0)", "_", "_"]
  ],
  [
    ["_", "_", "_", "_", "_"],
    ["PgUp", "Home", "End", "PgDn", "_"],
    ["_", "_", "_", "_", "_"],
    ["_", "TO(0)", "_", "_", "_"]
  ],
]

# === Хранилище настроек ===
[storage]

# === BLE настройка ===
[ble]
enabled = true

# === Сплит-конфигурация ===
[split]
connection = "ble"

# === Центральная сторона (ЛЕВАЯ) ===
[split.central]
rows = 4
cols = 5
row_offset = 0
col_offset = 0
ble_addr = [0x18, 0xe2, 0x21, 0x80, 0xc0, 0xc7]

[split.central.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P0_04", "P0_05", "P1_15", "P1_14", "P1_13"]

# === Периферийная сторона (ПРАВАЯ) ===
[[split.peripheral]]
rows = 4
cols = 5
row_offset = 4
col_offset = 5
ble_addr = [0x7e, 0xfe, 0x73, 0x9e, 0x66, 0xe3]

[split.peripheral.matrix]
matrix_type = "normal"
row_pins = ["P0_02", "P0_03", "P0_28", "P0_29"]
col_pins = ["P1_13", "P1_14", "P1_15", "P0_05", "P0_04"]
